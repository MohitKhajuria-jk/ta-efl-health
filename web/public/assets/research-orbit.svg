    <ellipse cx="530" cy="468" rx="337" ry="219" stroke="#0f766e" stroke-opacity=".22"/>
    <ellipse cx="530" cy="448" rx="337" ry="219" stroke="url(#edge)"/>
    <ellipse cx="530" cy="448" rx="266" ry="173" stroke="url(#ring)" stroke-width="38" opacity=".6"/>
    <ellipse cx="530" cy="430" rx="266" ry="173" stroke="url(#edge)" stroke-width="1.5"/>
    <ellipse cx="530" cy="448" rx="196" ry="127" stroke="url(#ring)" stroke-width="26" opacity=".65"/>
    <ellipse cx="530" cy="435" rx="196" ry="127" stroke="url(#edge)"/>
    <ellipse cx="530" cy="448" rx="132" ry="86" stroke="url(#ring)" stroke-width="20" opacity=".8"/>
    <ellipse cx="530" cy="438" rx="132" ry="86" stroke="url(#edge)"/>
    <path d="M194 448h168m300 0h205M530 228v125m0 190v125" stroke="#7ce8d3" stroke-opacity=".3" stroke-dasharray="4 7"/>
    <g fill="#0b1725" stroke="#7ce8d3"><circle cx="194" cy="448" r="8"/><circle cx="867" cy="448" r="8"/><circle cx="530" cy="228" r="8"/><circle cx="530" cy="668" r="8"/></g>
    <g fill="#7ce8d3"><circle cx="194" cy="448" r="2"/><circle cx="867" cy="448" r="2"/><circle cx="530" cy="228" r="2"/><circle cx="530" cy="668" r="2"/></g>
  </g>
  <g transform="translate(530 448)">
    <path d="m0-52 45 26v52L0 52l-45-26v-52Z" fill="#0b1725" stroke="#7ce8d3" stroke-opacity=".75"/>
    <path d="m-45-26 45 26 45-26M0 0v52" stroke="#7ce8d3" stroke-opacity=".4"/>
    <path d="M-13-14h26M0-27v26" stroke="#7ce8d3" stroke-width="3" stroke-linecap="round"/>
