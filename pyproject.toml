# Flower app definition — enables `flwr run .` alongside the Python entry points.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ta-efl-health"
version = "1.1.0"
description = "Trust-Aware Explainable Federated Learning for healthcare risk prediction"
requires-python = ">=3.10"
dependencies = [
    "flwr[simulation]>=1.13",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "gui"]

[tool.flwr.app]
publisher = "ta-efl"

[tool.flwr.app.components]
serverapp = "core.fl.server_app:app"
clientapp = "core.fl.client_app:app"

[tool.flwr.app.config]
dataset = "heart"
num-clients = 6
num-server-rounds = 30
dirichlet-alpha = 0.5
seed = 42
strategy = "trust"
attacks = "2:label_flip,4:noise"
kappa = 4.0
local-epochs = 3
lr = 0.15

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 6
