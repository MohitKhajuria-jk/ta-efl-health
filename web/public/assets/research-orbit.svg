<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" fill="none">
  <title>Research orbit</title>
  <desc>Original abstract artwork of connected concentric planes. Decorative, not a representation of active hospital connections or measured results.</desc>
  <defs>
    <linearGradient id="ring" x1="250" y1="180" x2="800" y2="760" gradientUnits="userSpaceOnUse"><stop stop-color="#7ce8d3"/><stop offset=".48" stop-color="#0f766e"/><stop offset="1" stop-color="#0b1725"/></linearGradient>
    <linearGradient id="edge" x1="220" y1="280" x2="760" y2="610" gradientUnits="userSpaceOnUse"><stop stop-color="#7ce8d3" stop-opacity=".1"/><stop offset=".5" stop-color="#7ce8d3" stop-opacity=".7"/><stop offset="1" stop-color="#7ce8d3" stop-opacity=".08"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#0f766e" stop-opacity=".3"/><stop offset="1" stop-color="#0b1725" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7ce8d3" opacity=".14"/></pattern>
  </defs>
  <rect width="1000" height="900" fill="url(#grid)"/>
  <ellipse cx="540" cy="450" rx="460" ry="420" fill="url(#glow)"/>
  <g transform="rotate(-28 530 450)">
